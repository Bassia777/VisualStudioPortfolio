# 把下面这段放进现有站点的 server{} 里（宝塔：网站 -> 设置 -> 配置文件）。
# 用 ^~ 前缀匹配，优先于该站点里针对 .js / .css 的正则 location，不会被误伤。
# 反向代理到 Next.js 服务，路径原样透传（应用侧 basePath=/portfolio 已对齐）。

location ^~ /portfolio {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    # 关键：宝塔面板在 nginx 的 http 层全局开启了 proxy_cache（cache_one），
    # 会把反代响应缓存到磁盘，导致重新部署后仍然返回旧页面。
    # 这里对本 location 关闭缓存，缓存交给 Next.js 自己管理。
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
}
